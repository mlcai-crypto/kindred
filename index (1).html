<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kindred Friend Finder</title>
<meta name="description" content="Take a personality quiz and find compatible friends nearby.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.authbox{display:flex;align-items:center;gap:8px;min-width:0}
.authbox .status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:22ch}

/* Layout: sticky top bar with three views (Matches / Quiz / Everyone); matches = profile rail + card list */
:root{
  --ts:1;
  --bg:#EFF1F7; --surface:#FFFFFF; --ink:#181B33; --muted:#5B6080; --line:#DADEEB;
  --accent:#4338CA; --accent-ink:#FFFFFF; --accent-soft:#E3E2FB;
  --sun:#D9900F; --sun-soft:#FCEFD3; --warn:#B4541A; --warn-soft:#FBE7DA;
  --av1:#F6C9B8; --av2:#C9DDF7; --av3:#CDEBD3; --av4:#EAD3F5; --av5:#F8E2A6; --av6:#BFE7E6; --av-ink:#22243A;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11132A; --surface:#1B1E3A; --ink:#ECEDF8; --muted:#A2A6C6; --line:#2D3159;
  --accent:#9F98FF; --accent-ink:#14163A; --accent-soft:#2A2960;
  --sun:#F4BC4F; --sun-soft:#3A311C; --warn:#F2A06E; --warn-soft:#3B2618;
  --av1:#7A4636; --av2:#33507A; --av3:#2F5E3E; --av4:#5B3B72; --av5:#6E5A1F; --av6:#215C5B; --av-ink:#F3F3FA;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11132A; --surface:#1B1E3A; --ink:#ECEDF8; --muted:#A2A6C6; --line:#2D3159;
  --accent:#9F98FF; --accent-ink:#14163A; --accent-soft:#2A2960;
  --sun:#F4BC4F; --sun-soft:#3A311C; --warn:#F2A06E; --warn-soft:#3B2618;
  --av1:#7A4636; --av2:#33507A; --av3:#2F5E3E; --av4:#5B3B72; --av5:#6E5A1F; --av6:#215C5B; --av-ink:#F3F3FA;
  color-scheme:dark;}

:root[data-mode="light"]{
  --bg:#EFF1F7; --surface:#FFFFFF; --ink:#181B33; --muted:#5B6080; --line:#DADEEB;
  --accent:#4338CA; --accent-ink:#FFFFFF; --accent-soft:#E3E2FB;
  --sun:#D9900F; --sun-soft:#FCEFD3; --warn:#B4541A; --warn-soft:#FBE7DA;
  --av1:#F6C9B8; --av2:#C9DDF7; --av3:#CDEBD3; --av4:#EAD3F5; --av5:#F8E2A6; --av6:#BFE7E6; --av-ink:#22243A;
  color-scheme:light;}
:root[data-mode="dark"]{
  --bg:#11132A; --surface:#1B1E3A; --ink:#ECEDF8; --muted:#A2A6C6; --line:#2D3159;
  --accent:#9F98FF; --accent-ink:#14163A; --accent-soft:#2A2960;
  --sun:#F4BC4F; --sun-soft:#3A311C; --warn:#F2A06E; --warn-soft:#3B2618;
  --av1:#7A4636; --av2:#33507A; --av3:#2F5E3E; --av4:#5B3B72; --av5:#6E5A1F; --av6:#215C5B; --av-ink:#F3F3FA;
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:calc(17.5px*var(--ts));line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:calc(24px*var(--ts));letter-spacing:-.02em}
.brand svg{width:30px;height:30px}
nav{display:flex;gap:4px;margin-left:auto;background:var(--bg);padding:4px;border-radius:999px}
nav button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;font-weight:600;font-size:calc(16.5px*var(--ts))}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

main{padding-block:28px 64px}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.intro h1{font-size:calc(clamp(30px,4.6vw,46px)*var(--ts));font-weight:800;letter-spacing:-.025em;max-width:22ch}
.intro p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--sun-soft);border-radius:var(--r);padding:12px 16px;margin-bottom:22px;font-size:calc(16.5px*var(--ts))}
.banner b{color:var(--ink)}
.btn{border:0;border-radius:999px;padding:9px 18px;font-weight:600;font-size:calc(16.5px*var(--ts));background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:6px 13px;font-size:calc(15px*var(--ts))}
.btn:disabled{opacity:.6;cursor:default}

.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
@media (max-width:860px){.rail{position:static}}
.rail h2{font-size:calc(20px*var(--ts))}
.eyebrow{font-size:calc(13px*var(--ts));font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.traits{display:flex;flex-direction:column;gap:11px}
.trait .lbl{display:flex;justify-content:space-between;font-size:calc(15px*var(--ts));font-weight:600}
.trait .ends{display:flex;justify-content:space-between;font-size:calc(13px*var(--ts));color:var(--muted)}
.bar{position:relative;height:8px;border-radius:99px;background:var(--bg);margin:4px 0 2px}
.bar i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);background:var(--accent);border:2px solid var(--surface)}
.bar i.them{background:var(--sun)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:calc(14.5px*var(--ts));padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.chip.shared{background:var(--accent-soft);border-color:transparent;font-weight:600}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:calc(15px*var(--ts));margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}

.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:calc(16.5px*var(--ts))}
.toolbar label{display:flex;align-items:center;gap:8px;color:var(--muted)}
.toolbar output{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;min-width:3.5ch}
.toolbar input[type=range]{accent-color:var(--accent);width:140px}
select{font:inherit;font-size:calc(16.5px*var(--ts));padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.count{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card .top{display:flex;gap:12px;align-items:center}
.who{min-width:0;flex:1}
.who h3{font-size:calc(20px*var(--ts));font-weight:700}
.who .meta{font-size:calc(15px*var(--ts));color:var(--muted);font-variant-numeric:tabular-nums}
.av{flex:none;width:52px;height:52px;border-radius:38% 62% 55% 45% / 50% 40% 60% 50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:calc(20px*var(--ts));color:var(--av-ink)}
.av.lg{width:72px;height:72px;font-size:calc(26px*var(--ts))}
.ring{flex:none;position:relative;width:54px;height:54px}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:calc(17.5px*var(--ts));font-variant-numeric:tabular-nums}
.ring .track{stroke:var(--bg)} .ring .val{stroke:var(--accent)}
.tagline{margin:0;font-size:calc(16.5px*var(--ts))}
.reasons{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:calc(16px*var(--ts))}
.reasons li{display:flex;gap:8px;align-items:flex-start}
.reasons li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:7px}
.reasons li.heads::before{background:var(--warn)}
.reasons li.heads{color:var(--warn)}
.card .actions{display:flex;gap:8px;margin-top:auto}
.demo{font-size:calc(12.5px*var(--ts));font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}

/* quiz */
.quiz{max-width:760px;display:flex;flex-direction:column;gap:20px}
fieldset{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:20px;margin:0;display:flex;flex-direction:column;gap:16px;min-width:0}
legend{font-family:var(--display);font-weight:700;font-size:calc(21px*var(--ts));padding:0 6px}
.hint{color:var(--muted);font-size:calc(16px*var(--ts));margin:-6px 0 0}
.q{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0;padding-bottom:0}
.q p{margin:0;font-weight:600}
.likert{display:grid;grid-template-columns:auto repeat(5,minmax(34px,1fr)) auto;align-items:center;gap:6px;font-size:calc(14px*var(--ts));color:var(--muted)}
.likert input{position:absolute;opacity:0;pointer-events:none}
.likert label{display:grid;place-items:center;height:42px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;color:var(--muted);font-size:calc(15px*var(--ts));cursor:pointer}
.likert input:checked + label{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.likert input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:480px){.likert{grid-template-columns:repeat(5,1fr)}.likert .end{grid-column:span 5}.likert .end:last-child{text-align:right}}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:calc(16.5px*var(--ts));font-weight:500;cursor:pointer;background:var(--surface)}
.pick input:checked + label{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.pick input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row > div{display:flex;flex-direction:column;gap:6px;flex:1;min-width:200px}
.row label.t{font-weight:600;font-size:calc(16.5px*var(--ts))}
input[type=text]{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.err{color:var(--warn);font-weight:600;font-size:calc(16.5px*var(--ts));margin:0}
.submitrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgb(10 12 30 / .5);display:flex;justify-content:flex-end}
.panel{background:var(--surface);width:min(520px,100%);height:100%;overflow-y:auto;padding:24px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 24px;padding-top:calc(24px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:18px}
.panel .top{display:flex;gap:14px;align-items:center}
.panel h2{font-size:calc(28px*var(--ts));font-weight:800}
.close{margin-left:auto;align-self:flex-start;border:0;background:var(--bg);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:calc(20px*var(--ts))}
.legend{display:flex;gap:14px;font-size:calc(14px*var(--ts));color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--accent)} .legend i.them{background:var(--sun)}
.bio{margin:0;font-size:calc(17.5px*var(--ts))}
.quote{margin:0;background:var(--bg);border-radius:12px;padding:12px 14px;font-size:calc(16.5px*var(--ts))}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}

.badge{font-size:calc(12.5px*var(--ts));font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;border:1px solid var(--line);color:var(--muted)}
.badge.member{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.badge.mutual{background:var(--sun-soft);border-color:transparent;color:var(--ink)}
.status{font-size:calc(14.5px*var(--ts));color:var(--muted);font-variant-numeric:tabular-nums}
.notice{border-radius:var(--r);padding:12px 16px;margin-bottom:22px;font-size:calc(16.5px*var(--ts));background:var(--warn-soft)}
.inbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:22px;display:flex;flex-direction:column;gap:10px}
.inbox .item{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.inbox .av{width:36px;height:36px;font-size:calc(15px*var(--ts))}
.inbox .item b{flex:1;min-width:0}
.check{display:flex;align-items:center;gap:8px;color:var(--muted)}
.check input{accent-color:var(--accent);width:16px;height:16px}
textarea{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical;min-height:70px}
.field-hint{font-size:calc(14.5px*var(--ts));color:var(--muted);margin:0}
.contact{background:var(--sun-soft);border-radius:12px;padding:12px 14px;font-size:calc(16.5px*var(--ts));user-select:all;overflow-wrap:anywhere}
.danger{color:var(--warn)}

.tools{display:flex;gap:6px;align-items:center;position:relative}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:40px;min-width:40px;padding:0 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700}
.iconbtn svg{width:19px;height:19px}
.iconbtn .aa{font-family:var(--display);font-size:calc(17px*var(--ts));line-height:1;letter-spacing:-.02em}
.iconbtn .aa small{font-size:.7em}
.iconbtn[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sizemenu{position:absolute;top:calc(100% + 8px);right:0;z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgb(15 18 45 / .18);padding:8px;min-width:210px;display:flex;flex-direction:column;gap:2px}
.sizemenu .eyebrow{padding:6px 10px 4px}
.sizemenu button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);text-align:left;padding:9px 10px;border-radius:10px;font-weight:600}
.sizemenu button[aria-checked="true"]::after{visibility:visible}
.sizemenu button:hover{background:var(--bg)}
.sizemenu button[aria-checked="true"]{background:var(--accent-soft)}
.sizemenu button::after{content:"✓";visibility:hidden;width:1em;color:var(--accent);font-weight:800}
.sizemenu .sample{margin-left:auto;min-width:2.2em;text-align:right;font-family:var(--display);font-weight:700;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand" aria-label="Kindred">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="16" r="9" fill="var(--accent)"/><circle cx="20" cy="16" r="9" fill="var(--sun)" opacity=".85"/></svg>
      Kindred
    </div>
    <div class="authbox" id="auth"></div>
    <nav aria-label="Sections">
      <button type="button" data-view="matches" aria-current="page">Matches</button>
      <button type="button" data-view="quiz">Your quiz</button>
      <button type="button" data-view="everyone">Everyone</button>
    </nav>
    <div class="tools">
      <button type="button" class="iconbtn" id="sizebtn" aria-haspopup="true" aria-expanded="false" aria-controls="sizemenu" aria-label="Text size"><span class="aa"><small>A</small>A</span></button>
      <div class="sizemenu" id="sizemenu" role="menu" aria-label="Text size" hidden>
        <div class="eyebrow">Text size</div>
        <button type="button" role="menuitemradio" data-size="0.9" aria-checked="false">Small <span class="sample" style="font-size:14px">Aa</span></button>
        <button type="button" role="menuitemradio" data-size="1" aria-checked="false">Default <span class="sample" style="font-size:16px">Aa</span></button>
        <button type="button" role="menuitemradio" data-size="1.15" aria-checked="false">Large <span class="sample" style="font-size:19px">Aa</span></button>
        <button type="button" role="menuitemradio" data-size="1.3" aria-checked="false">Extra large <span class="sample" style="font-size:22px">Aa</span></button>
      </div>
      <button type="button" class="iconbtn" id="themebtn" aria-label="Switch to dark mode"></button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="v-matches"></section>
  <section id="v-quiz" hidden></section>
  <section id="v-everyone" hidden></section>
</main>

<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="p-name"></div></div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
